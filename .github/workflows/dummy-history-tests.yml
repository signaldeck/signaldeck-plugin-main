name: DummyData tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "git+https://github.com/signaldeck/signaldeck-sdk.git@47105617f2ac71acecd3bb4f2d94f79389fab456"
      - run: python -m pip install pandas pytest requests paho-mqtt jsonpath-ng
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
